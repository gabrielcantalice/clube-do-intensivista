<svg width="234" height="164" viewBox="8 8 234 164" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rectGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7fcf9c"/>
      <stop offset="0.55" stop-color="#4a8fa8"/>
      <stop offset="1" stop-color="#2f5f8f"/>
