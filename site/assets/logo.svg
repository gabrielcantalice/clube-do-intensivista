  <circle cx="168" cy="30" r="5.5" fill="#6f679e"/>

  <!-- earpieces -->
  <circle cx="55" cy="26" r="9" fill="#6f679e"/>
  <circle cx="140" cy="19" r="9" fill="#6f679e"/>

  <!-- tubes forming the wishbone that becomes the rectangle's bottom-left edge -->
  <path d="M55 34 C 24 52 16 96 38 122 C 50 136 68 143 100 145"
        fill="none" stroke="#6f679e" stroke-width="10" stroke-linecap="round"/>
  <path d="M140 27 C 176 46 182 92 158 120 C 146 135 122 142 100 145"
